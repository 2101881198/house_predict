<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>智慧房源探索平台</title>
    <link rel="stylesheet" href="/houses/css/app.css">
</head>
<body>
<nav>
    <a href="/">首页</a>
    <a href="/province/">省级分析</a>
    <a href="/houses/">房源列表</a>
    <a href="/predict/">价格预测</a>
</nav>
<main>
    <h1>智慧房源探索平台</h1>
    <section>
        <h2>总览</h2>
        <p>房源总数：<strong th:text="${overview.total_houses}">0</strong></p>
        <p>城市数量：<strong th:text="${overview.city_count}">0</strong></p>
        <p>平均总价：<strong th:text="${overview.avg_total_price}">0</strong> 万</p>
        <p>平均单价：<strong th:text="${overview.avg_unit_price}">0</strong> 元/㎡</p>
    </section>
    <section>
        <h2>城市分布</h2>
        <table>
            <thead><tr><th>城市</th><th>数量</th><th>均价</th></tr></thead>
            <tbody>
            <tr th:each="row : ${overview.city_distribution}">
                <td th:text="${row.name}">城市</td>
                <td th:text="${row.count}">0</td>
                <td th:text="${row.avg_unit_price}">0</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
