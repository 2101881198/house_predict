<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${stats.city.name} + '分析'">城市分析</title>
    <link rel="stylesheet" href="/houses/css/app.css">
</head>
<body>
<nav>
    <a href="/">首页</a>
    <a href="/province/">省级分析</a>
    <a href="/houses/">房源列表</a>
    <a href="/predict/">价格预测</a>
</nav>
<main>
    <h1 th:text="${stats.city.name} + '房源分析'">城市房源分析</h1>
    <p>房源总数：<strong th:text="${stats.summary.total_houses}">0</strong></p>
    <p>区县数量：<strong th:text="${stats.summary.district_count}">0</strong></p>
    <table>
        <thead><tr><th>区县</th><th>数量</th><th>平均总价</th><th>平均单价</th></tr></thead>
        <tbody>
        <tr th:each="row : ${stats.districts}">
            <td th:text="${row.name}">区县</td>
            <td th:text="${row.count}">0</td>
            <td th:text="${row.avg_total_price}">0</td>
            <td th:text="${row.avg_unit_price}">0</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
